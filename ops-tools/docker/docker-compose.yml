version: "3.8"

networks:
  docker-practice-net:
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    ports:
      - "5432:5432"
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data
      - ../../data/dump:/db-dump
    networks:
      - docker-practice-net

  redis:
    image: redis:7
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - docker-practice-net

  app:
    build: .
    container_name: spring-app
    restart: always
    ports:
      - "8888:8080"
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/school
      SPRING_REDIS_HOST: redis-cache
    volumes:
      - ../../src/main/resources:/app/resources
      - ../../target:/app/target
    networks:
      - docker-practice-net